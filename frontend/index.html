<!doctype html>
<html lang="en" data-theme="deepslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__NAME__</title>
<link rel="icon" type="image/png" href="/static/brand/icon-32.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Menu">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#10141d"/><g shape-rendering="crispEdges" transform="translate(20 17.5) scale(5)"><path fill="#5ccf57" d="M4 0h4v1h-4zM2 1h8v1h-8zM1 2h10v2h-10zM0 4h12v7h-12zM0 11h3v1h-3zM4 11h4v1h-4zM9 11h3v1h-3zM0 12h2v1h-2zM5 12h2v1h-2zM10 12h2v1h-2z"/><path fill="#10141d" d="M3 5h2v2h-2zM7 5h2v2h-2z"/></g></svg>
      <div><strong id="brand-name">__NAME__</strong><span id="ver"></span></div>
    </div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <div class="meter" title="Memory used on this PC">
        <div class="meter-row"><span>PC memory</span><span id="sys-ram-text">-</span></div>
        <div class="meter-track"><div id="sys-ram-bar" class="meter-fill"></div></div>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"></button>
      <button class="btn only-server" id="btn-back" aria-label="Back to all servers" title="All servers"></button>
      <div class="srv-switch only-server">
        <span id="tb-icon" class="tb-icon"></span>
        <strong id="tb-name"></strong>
      </div>
      <div id="top-state" class="pill only-server">Offline</div>
      <button id="tb-other" class="chip only-server" hidden></button>
      <strong id="tb-title" class="only-home"></strong>
      <span class="grow"></span>
      <button id="tb-addr" class="chip only-server" hidden title="Copy the address friends use"></button>
      <button id="btn-restart" class="btn icon-only only-server" title="Restart server" aria-label="Restart server"></button>
      <button id="btn-kill" class="btn danger only-server" hidden>Force close</button>
      <button id="btn-main" class="btn primary only-server">Start server</button>
      <button id="btn-support" class="btn support-btn" title="Help, contact and privacy"><span class="ico-slot"></span>Support</button>
    </header>
    <div id="banner" class="banner" role="status" hidden></div>
    <main id="pages"></main>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form method="dialog">
    <h2 id="dlg-title"></h2>
    <p id="dlg-text"></p>
    <div id="dlg-field" class="field" hidden>
      <label for="dlg-input" id="dlg-label"></label>
      <input id="dlg-input" type="text" autocomplete="off">
    </div>
    <div class="dlg-actions">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="ok" id="dlg-ok">OK</button>
    </div>
  </form>
</dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="/brand.js"></script>
<script src="/static/schema.js"></script>
<script src="/static/demo.js"></script>
<script src="/static/core.js"></script>
<script src="/static/icons.js"></script>
<script src="/static/wizard.js"></script>
<script src="/static/propform.js"></script>
<script src="/static/pages-overview.js"></script>
<script src="/static/pages-console.js"></script>
<script src="/static/pages-players.js"></script>
<script src="/static/pages-settings.js"></script>
<script src="/static/pages-files.js"></script>
<script src="/static/pages-plugins.js"></script>
<script src="/static/pages-backups.js"></script>
<script src="/static/pages-automation.js"></script>
<script src="/static/pages-servers.js"></script>
<script src="/static/pages-network.js"></script>
<script src="/static/pages-panel.js"></script>
<script src="/static/policy.js"></script>
<script src="/static/privacy.js"></script>
<script src="/static/main.js"></script>
</body>
</html>
