name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r requirements.txt pyinstaller httpx

      - name: "Tests (informational, they were written on Linux)"
        continue-on-error: true
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem tests\test_*.py | ForEach-Object { python -I $_.FullName; if ($LASTEXITCODE -ne 0) { $failed = 1 } }
          exit $failed

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build app and installer
        run: python tools/build_windows.py

      - name: Read the version from backend/brand.py
        id: v
        shell: pwsh
        run: python -c "from backend import brand; print('name=' + brand.NAME); print('version=' + brand.VERSION)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.name }}-${{ steps.v.outputs.version }}-installer
          path: dist-installer/*

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.v.outputs.name }} ${{ steps.v.outputs.version }}
          files: dist-installer/*
