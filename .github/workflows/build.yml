name: Build Windows installer

# Pushing a tag like v0.1.2 builds the installer and publishes the release.
# Starting it by hand (workflow_dispatch) only builds and tests: it never publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# No permissions by default. Each job asks for what it needs.
permissions: {}

jobs:
  build:
    # Read-only: this job runs tests, pip packages and the build, so it gets no write access to the repository.
    if: github.repository == 'Shubhamkeshri433/Zighost'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.v.outputs.name }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r requirements.txt pyinstaller httpx

      # A failing test stops the build, so no release is made from it.
      # test_manager.py is the one exception: it fakes Java with Linux-style scripts and is still being ported to Windows.
      - name: Tests (a failure stops the release)
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem tests\test_*.py | Where-Object { $_.Name -ne "test_manager.py" } | ForEach-Object {
            python -I $_.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "FAILED: $($_.Name)"; $failed = 1 }
          }
          exit $failed

      - name: Tests that are informational only (test_manager.py)
        continue-on-error: true
        run: python -I tests\test_manager.py

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build app and installer
        run: python tools/build_windows.py

      - name: Read the version from backend/brand.py
        id: v
        shell: pwsh
        run: python -c "from backend import brand; print('name=' + brand.NAME); print('version=' + brand.VERSION)" >> $env:GITHUB_OUTPUT

      # A tag must match the version inside the app, so a wrong or stale tag cannot publish the wrong build.
      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.v.outputs.version }}") { Write-Error "Tag ${{ github.ref_name }} does not match the app version ${{ steps.v.outputs.version }}"; exit 1 }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.v.outputs.name }}-${{ steps.v.outputs.version }}-installer
          path: dist-installer/*
          if-no-files-found: error

  release:
    # Only for tags, only from the repository itself, and only for a commit that is on main.
    if: github.repository == 'Shubhamkeshri433/Zighost' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag ${GITHUB_REF_NAME} is not on main. Not releasing."; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.name }}-${{ needs.build.outputs.version }}-installer
          path: dist-installer

      - name: Check the files against SHA256SUMS.txt
        working-directory: dist-installer
        run: |
          test -f SHA256SUMS.txt
          tr -d '\r' < SHA256SUMS.txt | grep -v 'SHA256SUMS.txt' | sha256sum -c -

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ needs.build.outputs.name }} ${{ needs.build.outputs.version }}
          files: dist-installer/*
